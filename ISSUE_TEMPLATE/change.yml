name: Text Change | Изменение текста
description: Propose a specific change to an existing document | Предложить конкретную поправку
title: "[CHANGE] "
labels:
  - text-change

body:
  - type: input
    id: section
    attributes:
      label: Section | Раздел
      placeholder: e.g. TP-0001, Principle 4
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current wording | Текущая формулировка
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed wording | Предлагаемая формулировка
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason | Причина
      description: Explain why this change is needed.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks | Риски
      description: What new risks or unintended consequences could this change introduce?

  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation | Как проверить
      description: How could the proposed change be evaluated or reviewed?
